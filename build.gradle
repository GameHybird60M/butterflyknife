plugins { id 'fabric-loom' version "${loom_version}" }
version = '1.0.0'; group = 'com.example'
base { archivesName = 'butterflyknife' }
loom { splitEnvironmentSourceSets(); mods { butterflyknife { sourceSet sourceSets.main; sourceSet sourceSets.client } } }
dependencies {
  minecraft "com.mojang:minecraft:${minecraft_version}"
  mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
  modImplementation "net.fabricmc:fabric-loader:${loader_version}"
  modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
